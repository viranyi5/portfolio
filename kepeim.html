<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Képek – Petko portfólió</title>

    <!-- Favicon -->
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="favicon.png">

    <!-- Stílusok és betűtípusok -->
    <link rel="stylesheet" href="styles.css?v=20260821p">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="container gallery-page">
        <a href="index.html#projects" class="back-to-portfolio" title="Vissza a portfólióra" aria-label="Vissza a portfólióra">
            <i class="fas fa-arrow-left"></i>
            <span class="back-to-portfolio-text">Vissza a portfólióra</span>
        </a>

        <h1 class="section-title">Képek</h1>

        <!-- Képgaléria -->
        <section class="gallery-grid">

            <article class="gallery-item">
                <button type="button" class="gallery-img-wrap" aria-label="Kép nagyítása">
                    <img src="cipo.png" alt="Nike Air Force 1" loading="lazy" class="gallery-img"
                         onerror="this.onerror=null;this.src='images/cipo.png';">
                </button>
                <h2 class="gallery-caption">🟣</h2>
            </article>

            <article class="gallery-item">
                <button type="button" class="gallery-img-wrap" aria-label="Kép nagyítása">
                    <img src="szarvas.png" alt="Szarvas" loading="lazy" class="gallery-img"
                         onerror="this.onerror=null;this.src='images/szarvas.png';">
                </button>
                <h2 class="gallery-caption">🦌 ✨</h2>
            </article>

            <article class="gallery-item">
                <button type="button" class="gallery-img-wrap" aria-label="Kép nagyítása">
                    <img src="vulcan.png" alt="Vulcan AK-47" loading="lazy" class="gallery-img"
                         onerror="this.onerror=null;this.src='images/vulcan.png';">
                </button>
                <h2 class="gallery-caption gallery-caption--blue">Vulcan AK-47</h2>
            </article>

            <article class="gallery-item">
                <button type="button" class="gallery-img-wrap" aria-label="Kép nagyítása">
                    <img src="mrbeast.png" alt="MrBeast effect" loading="lazy" class="gallery-img"
                         onerror="this.onerror=null;this.src='images/mrbeast.png';">
                </button>
                <h2 class="gallery-caption gallery-caption--red">MrBeast effect</h2>
            </article>

        </section>
    </main>

    <!-- Lightbox – kép nagyítása kattintásra -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Nagyított kép" aria-hidden="true">
        <div class="lightbox-backdrop"></div>
        <button type="button" class="lightbox-close" aria-label="Bezárás"><i class="fas fa-times"></i></button>
        <div class="lightbox-inner">
            <img src="" alt="" class="lightbox-img">
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2026 Portfolio. Minden jog fenntartva.</p>
                <div class="social-links">
                    <a href="https://instagram.com/petkowr" target="_blank" rel="noopener noreferrer">
                        <i class="fab fa-instagram"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="script.js?v=20260821p"></script>
</body>
</html>
